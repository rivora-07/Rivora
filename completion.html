<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You made something! — Rivora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Great+Vibes&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#8b5cf6" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/completion.css" />
</head>
<body>
  <nav class="nav-bar" role="navigation">
    <a href="./island.html" class="nav-logo"><span class="logo-island">🌊</span><span class="logo-text">Rivora</span></a>
  </nav>
  <div class="confetti-container" aria-hidden="true">
    <span class="confetti c1">🌊</span><span class="confetti c2">🐚</span><span class="confetti c3">⭐</span><span class="confetti c4">💜</span><span class="confetti c5">✨</span><span class="confetti c6">🐰</span><span class="confetti c7">💖</span>
  </div>
  <main class="completion-page container">
    <section class="pixel-section completion-pixel animate-fade-in">
      <div class="pixel-avatar pixel-avatar--large animate-float" role="img">🐰</div>
      <div class="pixel-bubble pixel-bubble--celebration" aria-live="polite" aria-atomic="true"><p id="pixel-bubble-text">I like your version. 🌟</p></div>
    </section>
    <section class="completion-name animate-fade-in"><h1 id="creation-title">You made something! ✨</h1><p class="text-soft" style="margin-top:6px;">It's saved in your gallery.</p></section>
    <section class="reflection-card card animate-slide-up">
      <label class="reflection-question" for="reflection-input" id="reflection-label">What surprised you while making this?</label>
      <textarea id="reflection-input" class="reflection-textarea" placeholder="Type anything... or just skip." rows="3" aria-labelledby="reflection-label" aria-describedby="reflection-hint"></textarea>
      <p id="reflection-hint" class="text-soft" style="font-size:0.78rem; margin-top:6px;">This is just for you. Nobody else sees it.</p>
    </section>
    <section class="completion-actions animate-slide-up">
      <button class="btn btn-ghost" id="btn-skip-reflection">Skip ↗</button>
      <button class="btn btn-secondary" id="btn-download" style="display:none;">Download 📥</button>
      <a href="./challenges.html" class="btn btn-primary btn-lg">Make Another! 🎨</a>
      <a href="./creations.html" class="btn btn-secondary">My Gallery 🎨</a>
    </section>
    <footer class="rivora-footer">
      <p class="footer-love">Built with ❤️ by Ritvija</p>
      <p class="footer-founded">Founded on 7 June 2026</p>
      <p class="footer-tagline">Every kid deserves great tools</p>
      <div class="footer-links"><a href="./privacy.html">Privacy Promise</a><a href="./feedback.html">Send Feedback</a>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./js/storage.js"></script>
  <script src="./js/pixel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const n = new URLSearchParams(window.location.search).get('name') || 'Your Creation';
      document.getElementById('creation-title').textContent = `"${n}" is done! ✨`;
      document.title = `${n} — Rivora`;
      initPixel('completion');
      setTimeout(() => { setPixelMessage(`"${n}" — I like your version. 🌟`); }, 2000);
      const a = getAllCreations();
      if (a.length > 0) { const l = a[0], b = document.getElementById('btn-download'); b.style.display = 'inline-flex'; b.addEventListener('click', () => { const x = document.createElement('a'); x.href = l.imageData; x.download = `${n.replace(/[^a-z0-9]/gi,'_')}_rivora.png`; x.click(); showToast('Downloading! 📥'); }); }
      document.getElementById('btn-skip-reflection')?.addEventListener('click', () => { window.location.href = './challenges.html'; });
      document.getElementById('reflection-input')?.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.location.href = './challenges.html'; } });
    });
  </script>
</body>
</html>
