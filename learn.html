<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn — Rivora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Great+Vibes&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#8b5cf6" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/learn.css" />
</head>
<body>
  <nav class="nav-bar" role="navigation">
    <a href="./island.html" class="nav-logo"><span class="logo-island">🌊</span><span class="logo-text">Rivora</span></a>
    <a href="./island.html" class="btn btn-ghost">← Island</a>
  </nav>
  <main class="page-section container">
    <section id="lesson-list-view">
      <div class="pixel-section animate-fade-in">
        <div class="pixel-avatar animate-float" role="img" aria-label="Pixel">🐰</div>
        <div class="pixel-bubble" aria-live="polite" aria-atomic="true"><p id="pixel-bubble-text">Loading...</p></div>
      </div>
      <div class="page-header"><h1>📚 Learn</h1></div>
      <p style="margin-bottom:18px; font-weight:600;">Pick a lesson. Each one teaches you one cool thing!</p>
      <div id="lessons-container" class="lessons-grid stagger-children" role="list"></div>
    </section>
    <section id="lesson-detail-view" style="display:none;">
      <div class="page-header">
        <button class="btn btn-ghost" id="back-to-lessons">← Back</button>
        <h1 id="lesson-detail-title">Lesson</h1>
      </div>
      <div class="pixel-section animate-fade-in">
        <div class="pixel-avatar animate-float" role="img" aria-label="Pixel">🐰</div>
        <div class="pixel-bubble" aria-live="polite" aria-atomic="true"><p id="lesson-pixel-text">Try the slider!</p></div>
      </div>
      <div class="lesson-explanation card animate-fade-in" id="lesson-content"></div>
      <div class="lesson-interactive card animate-slide-up" id="lesson-interactive" style="margin-top:18px;">
        <div class="demo-image-container"><img id="demo-image" src="" alt="Demo" class="demo-image" loading="lazy" /></div>
        <div id="lesson-controls" style="margin-top:14px;"></div>
      </div>
      <div style="text-align:center; margin-top:24px;">
        <a href="./challenges.html" class="btn btn-primary btn-lg">Try it in a Challenge! 🎒</a>
      </div>
    </section>
  </main>
  <script src="./js/pixel.js"></script>
  <script src="./js/learn.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const id = new URLSearchParams(window.location.search).get('lesson');
      if (id) { showDetail(id); } else { showList(); initPixel('learn'); }
      document.getElementById('back-to-lessons')?.addEventListener('click', () => { window.location.href = './learn.html'; });
    });
    function showList() { const c = document.getElementById('lessons-container'); getAllLessons().forEach(l => c.appendChild(renderLessonCard(l))); }
    function showDetail(id) {
      const l = getLessonById(id); if (!l) { window.location.href = './learn.html'; return; }
      document.getElementById('lesson-list-view').style.display = 'none';
      document.getElementById('lesson-detail-view').style.display = 'block';
      document.getElementById('lesson-detail-title').textContent = `${l.emoji} ${l.title}`;
      document.getElementById('lesson-content').innerHTML = l.content;
      document.title = `${l.title} — Learn — Rivora`;
      const img = document.getElementById('demo-image'); img.src = l.demoImage; img.alt = `Example for ${l.title}`;
      initPixel('learn', 'Try moving the slider!');
      buildInteractive(l);
    }
    function buildInteractive(l) {
      const el = document.getElementById('lesson-controls'); const img = document.getElementById('demo-image');
      if (l.interactiveType === 'slider') {
        el.innerHTML = `<div class="control-label"><label for="lesson-slider">${l.interactiveLabel}</label><span class="control-value" id="lsv">${l.sliderDefault}</span></div><input type="range" class="control-slider" id="lesson-slider" min="${l.sliderMin}" max="${l.sliderMax}" value="${l.sliderDefault}" aria-label="${l.interactiveLabel}" aria-valuenow="${l.sliderDefault}" />`;
        const s = document.getElementById('lesson-slider'), v = document.getElementById('lsv');
        s.addEventListener('input', () => { const val = parseFloat(s.value); v.textContent = val; s.setAttribute('aria-valuenow', val);
          if (l.id === 'lesson_rotate') { img.style.transform = `rotate(${val}deg)`; img.style.filter = ''; }
          else if (l.cssFilter) { img.style.filter = l.cssFilter(val); img.style.transform = ''; }
        });
      } else { el.innerHTML = `<p class="text-soft" style="text-align:center;">💡 Try it in a Challenge!</p>`; }
    }
  </script>
</body>
</html>
