<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Creations — Rivora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Great+Vibes&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#8b5cf6" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/creations.css" />
</head>
<body>
  <nav class="nav-bar" role="navigation">
    <a href="./island.html" class="nav-logo"><span class="logo-island">🌊</span><span class="logo-text">Rivora</span></a>
    <a href="./island.html" class="btn btn-ghost">← Island</a>
  </nav>
  <main class="page-section container">
    <div class="pixel-section animate-fade-in">
      <div class="pixel-avatar animate-float" role="img">🐰</div>
      <div class="pixel-bubble" aria-live="polite" aria-atomic="true"><p id="pixel-bubble-text">Loading...</p></div>
    </div>
    <div class="page-header"><h1>🎨 My Creations</h1></div>
    <div id="creations-gallery" class="creations-grid stagger-children" role="list"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <div class="empty-icon" aria-hidden="true">🎨</div>
      <h2>Your gallery is empty!</h2>
      <p style="margin-top:6px;">Complete a challenge to save your first creation.</p>
      <a href="./challenges.html" class="btn btn-primary" style="margin-top:18px;">Try a Challenge 🎒</a>
    </div>
    <footer class="rivora-footer">
      <p class="footer-love">Built with ❤️ by Ritvija</p>
      <p class="footer-founded">Founded on 7 June 2026</p>
      <p class="footer-tagline">Every kid deserves great tools</p>
      <div class="footer-links"><a href="./privacy.html">Privacy Promise</a><a href="./feedback.html">Send Feedback</a></div>
    </footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./js/storage.js"></script>
  <script src="./js/modal.js"></script>
  <script src="./js/pixel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { initPixel('creations'); render(); });
    function render() {
      const g = document.getElementById('creations-gallery'), e = document.getElementById('empty-state'), c = getAllCreations();
      if (c.length === 0) { e.style.display = 'block'; setPixelMessage('Empty! Go make something! 🎨'); return; }
      setPixelMessage(`${c.length} creation${c.length>1?'s':''}! 🌟`);
      c.forEach((cr,i) => g.appendChild(card(cr,i)));
    }
    function card(cr,i) {
      const a = document.createElement('article'); a.className = 'creation-card card animate-fade-in'; a.setAttribute('role','listitem'); a.style.animationDelay = `${i*60}ms`;
      const d = new Date(cr.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
      a.innerHTML = `<button class="creation-thumbnail-btn" aria-label="View: ${cr.name}"><img src="${cr.imageData}" alt="${cr.name}" class="creation-thumbnail" loading="lazy" /></button><div class="creation-info"><h3 class="card-title creation-name">${cr.name}</h3><p class="card-meta">${d}</p></div>`;
      a.querySelector('.creation-thumbnail-btn').addEventListener('click', () => openM(cr)); return a;
    }
    function openM(cr) {
      openRivoraModal({ title: cr.name, contentHTML: `<img src="${cr.imageData}" alt="${cr.name}" style="width:100%;max-height:50vh;object-fit:contain;border-radius:14px;background:linear-gradient(135deg,#eef4ff,#f0e6ff);margin-bottom:14px;" /><p style="font-size:0.82rem;color:#7f7f9a;margin-bottom:16px;font-weight:600;">Created ${new Date(cr.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</p><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-coral" onclick="dl('${cr.id}')">Download 📥</button><button class="btn btn-ghost" onclick="del('${cr.id}','${cr.name.replace(/'/g,"\\'")}')">Delete 🗑</button></div>` });
    }
    function dl(id) { const c = getCreationById(id); if(!c) return; const a = document.createElement('a'); a.href = c.imageData; a.download = `${c.name.replace(/[^a-z0-9]/gi,'_')}_rivora.png`; a.click(); showToast('Downloading! 📥'); }
    function del(id,name) { if(!confirm(`Delete "${name}"?`)) return; deleteCreation(id); closeRivoraModal(); document.getElementById('creations-gallery').innerHTML=''; render(); showToast('Deleted.'); }
  </script>
</body>
</html>
